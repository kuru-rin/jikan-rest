{{- $secretName := .Values.appKeySecret }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "jikan-rest.labels" . | nindent 4 }}
type: Opaque
data:
  app-key: {{ if $existing }}{{ index $existing.data "app-key" }}{{ else }}{{ printf "base64:%s" (randBytes 32) | b64enc }}{{ end }}
